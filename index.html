<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Room Finder</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img class="logo" src="./Achievers_Logo_Blue_RGB.png" alt="The Achievers logo" />
        <div class="brandText">
          <p class="title">Achievers Student Lesson Finder</p>
          <p class="subtitle">Find your lesson time and room for today.</p>
        </div>
      </div>
    </header>

    <main>
      <section class="panel" aria-label="Search panel">
        <div class="panelInner">
          <div class="searchRow">
            <div class="field">
              <label for="name">Student / Teacher name</label>
              <input id="name" type="text" autocomplete="name" placeholder="Enter student or tutor name (e.g. Peter Chan)" />
            </div>
            <div class="searchBtnWrap">
              <button id="searchBtn" onclick="search()">Search</button>
            </div>
          </div>

          <div id="results" class="results" role="status" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
